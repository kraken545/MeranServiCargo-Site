<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Meran Servi Cargo</title>
<meta name="robots" content="noindex">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#031632;color:#fff;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .wrap{max-width:520px}
  .code{font-size:clamp(4rem,14vw,7rem);font-weight:900;letter-spacing:-.03em;line-height:1;color:#B6171E}
  h1{font-size:clamp(1.3rem,4vw,1.7rem);font-weight:800;margin:18px 0 10px}
  p{color:rgba(255,255,255,.72);margin-bottom:28px}
  .btn{display:inline-block;background:#B6171E;color:#fff;padding:14px 30px;font-size:12px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;border-radius:2px;text-decoration:none;transition:background .2s}
  .btn:hover{background:#8e1116}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscas no existe o fue movida.<br>Page not found.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </div>
</body>
</html>
